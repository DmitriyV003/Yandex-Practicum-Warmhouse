syntax = "proto3";

package telemetry;

option go_package = "telemetry-service/proto";

import "google/protobuf/timestamp.proto";

service TelemetryService {
  rpc RecordTelemetry(RecordTelemetryRequest) returns (TelemetryResponse);
  rpc GetLatestTelemetry(GetTelemetryRequest) returns (TelemetryResponse);
  rpc ListTelemetry(ListTelemetryRequest) returns (ListTelemetryResponse);
  rpc CollectFromSensor(CollectFromSensorRequest) returns (TelemetryResponse);
}

message RecordTelemetryRequest {
  int32  sensor_id = 1;
  double value     = 2;
  string unit      = 3;
}

message GetTelemetryRequest {
  int32 sensor_id = 1;
}

message ListTelemetryRequest {
  int32 sensor_id = 1;
  int32 limit     = 2;
}

message CollectFromSensorRequest {
  int32  sensor_id = 1;
  string location  = 2;
}

message TelemetryResponse {
  int32  id        = 1;
  int32  sensor_id = 2;
  double value     = 3;
  string unit      = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListTelemetryResponse {
  repeated TelemetryResponse records = 1;
}
